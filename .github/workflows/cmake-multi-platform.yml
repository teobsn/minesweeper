name: CMake Build, multi-platform

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (Ubuntu)
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libraylib-dev libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build CLI
      run: cmake --build build --target minesweeper -j$(nproc)

    - name: Build GUI
      run: cmake --build build --target minesweeper-gui -j$(nproc)

    - name: Build Test
      run: cmake --build build --target minesweeper-test -j$(nproc)

    - name: Build Benchmark
      run: cmake --build build --target minesweeper-benchmark -j$(nproc)

    - name: Build Animation Demo
      run: cmake --build build --target minesweeper-animation-demo -j$(nproc)

  build-macos:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (macOS)
      run: |
        brew install cmake raylib

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build CLI
      run: cmake --build build --target minesweeper -j$(sysctl -n hw.ncpu)

    - name: Build GUI
      run: cmake --build build --target minesweeper-gui -j$(sysctl -n hw.ncpu)

    - name: Build Test
      run: cmake --build build --target minesweeper-test -j$(sysctl -n hw.ncpu)

    - name: Build Benchmark
      run: cmake --build build --target minesweeper-benchmark -j$(sysctl -n hw.ncpu)

    - name: Build Animation Demo
      run: cmake --build build --target minesweeper-animation-demo -j$(sysctl -n hw.ncpu)
