name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev

    - name: Build and Install raylib (Linux)
      if: runner.os == 'Linux'
      run: |
        git clone --depth 1 https://github.com/raysan5/raylib.git raylib-src
        mkdir -p raylib-src/build
        cd raylib-src/build
        cmake -DBUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release ..
        make -j$(nproc)
        sudo make install
        sudo ldconfig

    - name: Install Dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install raylib

    - name: Install raylib (Windows)
      if: runner.os == 'Windows'
      run: |
        vcpkg install raylib:x64-windows

    - name: Configure CMake
      shell: bash
      run: |
        if [ "${{ runner.os }}" == "Windows" ]; then
          cmake -B build -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DBUILD_CLI=OFF -DCMAKE_BUILD_TYPE=Release
        else
          cmake -B build -DCMAKE_BUILD_TYPE=Release
        fi

    - name: Build Project
      run: cmake --build build --config Release --parallel 8

    - name: Prepare Artifacts
      shell: bash
      run: |
        mkdir -p dist/resources
        cp -r resources/* dist/resources/
        if [ "${{ runner.os }}" == "Windows" ]; then
          # On Windows, try to find .exe in build/Release/ or build/
          cp build/Release/*.exe dist/ 2>/dev/null || cp build/*.exe dist/ 2>/dev/null || true
        else
          # On Linux and macOS, copy all 'minesweeper*' binaries from the build root
          # We use a portable check instead of 'find -executable'
          for f in build/minesweeper*; do
            if [ -x "$f" ] && [ -f "$f" ]; then
              cp "$f" dist/
            fi
          done
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: minesweeper-${{ matrix.os }}
        path: dist/
