name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev

    - name: Build and Install raylib (Linux)
      if: runner.os == 'Linux'
      run: |
        git clone --depth 1 https://github.com/raysan5/raylib.git raylib-src
        mkdir -p raylib-src/build
        cd raylib-src/build
        cmake -DBUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release ..
        make -j$(nproc)
        sudo make install
        sudo ldconfig

    - name: Install Dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install raylib

    - name: Install raylib (Windows)
      if: runner.os == 'Windows'
      run: |
        vcpkg install raylib:x64-windows

    - name: Configure CMake
      shell: bash
      run: |
        if [ "${{ runner.os }}" == "Windows" ]; then
          cmake -B build -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
                -DBUILD_CLI=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_CONFIGURATION_TYPES=Release
        else
          cmake -B build -DCMAKE_BUILD_TYPE=Release
        fi

    - name: Build Project
      run: cmake --build build --config Release --parallel 8

    - name: Prepare Artifacts
      shell: bash
      run: |
        mkdir -p dist/resources
        cp -r resources/* dist/resources/
        if [ "${{ runner.os }}" == "Windows" ]; then
          # Ensure 7-Zip is in PATH (standard location on GitHub runners)
          export PATH=$PATH:"/C/Program Files/7-Zip"
          # Only copy from Release directory to ensure no Debug binary is picked up
          cp build/Release/*.exe dist/ 2>/dev/null || true
          
          # Explicitly copy required runtime DLLs from vcpkg
          VCPKG_TRIPLET="x64-windows"
          VCPKG_BIN="$VCPKG_INSTALLATION_ROOT/installed/${VCPKG_TRIPLET}/bin"

          # Copy raylib.dll (required for the GUI executable)
          if [ -f "$VCPKG_BIN/raylib.dll" ]; then
            cp "$VCPKG_BIN/raylib.dll" dist/
            echo "Copied raylib.dll"
          fi

          # Copy glfw3.dll (required by raylib for window/input management)
          if [ -f "$VCPKG_BIN/glfw3.dll" ]; then
            cp "$VCPKG_BIN/glfw3.dll" dist/
            echo "Copied glfw3.dll"
          fi

          # Copy winmm.dll if present (Windows multimedia library, sometimes needed)
          if [ -f "$VCPKG_BIN/winmm.dll" ]; then
            cp "$VCPKG_BIN/winmm.dll" dist/
            echo "Copied winmm.dll"
          fi

          # Fallback: if DLLs weren't found in the standard location, search the entire vcpkg installed tree
          if [ ! -f "dist/raylib.dll" ] || [ ! -f "dist/glfw3.dll" ]; then
            echo "Some DLLs missing, searching vcpkg tree..."
            find "$VCPKG_INSTALLATION_ROOT/installed" -maxdepth 3 -name "*.dll" -exec cp {} dist/ \;
          fi

          # Verify that the critical DLLs are present
          if [ ! -f "dist/raylib.dll" ]; then
            echo "ERROR: raylib.dll was not found in any location!"
            exit 1
          fi

          # Use 7z on Windows as zip is missing in the default bash path
          cd dist && 7z a -tzip ../minesweeper-windows.zip * && cd ..
        elif [ "${{ runner.os }}" == 'macOS' ]; then
          for f in build/minesweeper*; do
            if [ -x "$f" ] && [ -f "$f" ]; then cp "$f" dist/; fi
          done
          cd dist && zip -r ../minesweeper-macos.zip . * && cd ..
        else
          for f in build/minesweeper*; do
            if [ -x "$f" ] && [ -f "$f" ]; then cp "$f" dist/; fi
          done
          cd dist && tar -czf ../minesweeper-linux.tar.gz . * && cd ..
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: minesweeper-${{ matrix.os }}
        path: |
          minesweeper-windows.zip
          minesweeper-macos.zip
          minesweeper-linux.tar.gz
        if-no-files-found: ignore

  release:
    name: Create Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare Release Files
      run: |
        mkdir -p release-assets
        find artifacts -name "*.zip" -exec cp {} release-assets/ \;
        find artifacts -name "*.tar.gz" -exec cp {} release-assets/ \;

    - name: Generate Tag
      id: tag
      run: echo "tag=build-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        name: Build ${{ steps.tag.outputs.tag }}
        body: |
          Continuous build for commit ${{ github.sha }}
          
          Assets for Windows, macOS, and Linux are attached below.
        files: release-assets/*
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
