name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev

    - name: Build and Install raylib (Linux)
      if: runner.os == 'Linux'
      run: |
        git clone --depth 1 https://github.com/raysan5/raylib.git raylib-src
        mkdir -p raylib-src/build
        cd raylib-src/build
        cmake -DBUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release ..
        make -j$(nproc)
        sudo make install
        sudo ldconfig

    - name: Install Dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install raylib

    - name: Setup MinGW (Windows)
      if: runner.os == 'Windows'
      uses: egor-tensin/setup-mingw@v2
      with:
        platform: x64

    - name: Build raylib from source (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        git clone --depth 1 https://github.com/raysan5/raylib.git raylib-src
        mkdir -p raylib-src/build
        cd raylib-src/build
        cmake -G "MinGW Makefiles" -DBUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release ..
        mingw32-make -j$(nproc)
        # Note: We don't install globally, we'll point CMake to this build directory

    - name: Configure CMake
      shell: bash
      run: |
        if [ "${{ runner.os }}" == "Windows" ]; then
          cmake -B build -G "MinGW Makefiles" \
                -DBUILD_CLI=OFF -DCMAKE_BUILD_TYPE=Release \
                -Draylib_DIR="$(pwd)/raylib-src/build/raylib" \
                -DCMAKE_PREFIX_PATH="$(pwd)/raylib-src/build/raylib"
        else
          cmake -B build -DCMAKE_BUILD_TYPE=Release
        fi

    - name: Build Project
      run: |
        if [ "${{ runner.os }}" == "Windows" ]; then
          cmake --build build --parallel 8
        else
          cmake --build build --config Release --parallel 8
        fi

    - name: Prepare Artifacts
      shell: bash
      run: |
        mkdir -p dist/resources
        cp -r resources/* dist/resources/
        if [ "${{ runner.os }}" == "Windows" ]; then
          # Ensure 7-Zip is in PATH
          export PATH=$PATH:"/C/Program Files/7-Zip"
          
          # Copy executables
          cp build/*.exe dist/ 2>/dev/null || true
          
          # Copy raylib.dll from our build
          if [ -f "raylib-src/build/raylib/raylib.dll" ]; then
            cp "raylib-src/build/raylib/raylib.dll" dist/
            echo "Copied raylib.dll"
          fi

          # Verify that the critical DLLs are present
          if [ ! -f "dist/raylib.dll" ]; then
            echo "ERROR: raylib.dll was not found!"
            exit 1
          fi

          # Use 7z on Windows as zip is missing in the default bash path
          cd dist && 7z a -tzip ../minesweeper-windows.zip * && cd ..
        elif [ "${{ runner.os }}" == 'macOS' ]; then
          for f in build/minesweeper*; do
            if [ -x "$f" ] && [ -f "$f" ]; then cp "$f" dist/; fi
          done
          cd dist && zip -r ../minesweeper-macos.zip . * && cd ..
        else
          for f in build/minesweeper*; do
            if [ -x "$f" ] && [ -f "$f" ]; then cp "$f" dist/; fi
          done
          cd dist && tar -czf ../minesweeper-linux.tar.gz . * && cd ..
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: minesweeper-${{ matrix.os }}
        path: |
          minesweeper-windows.zip
          minesweeper-macos.zip
          minesweeper-linux.tar.gz
        if-no-files-found: ignore

  release:
    name: Create Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare Release Files
      run: |
        mkdir -p release-assets
        find artifacts -name "*.zip" -exec cp {} release-assets/ \;
        find artifacts -name "*.tar.gz" -exec cp {} release-assets/ \;

    - name: Generate Tag
      id: tag
      run: echo "tag=build-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        name: Build ${{ steps.tag.outputs.tag }}
        body: |
          Continuous build for commit ${{ github.sha }}
          
          Assets for Windows, macOS, and Linux are attached below.
        files: release-assets/*
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
